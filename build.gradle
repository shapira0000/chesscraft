plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = 'chesscraft'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chesscraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			programArgs "--username", "ChessDev"
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "chesscraft-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// The client game test drives real network traffic (block entity sync); the synchronizer
// cannot follow it, so it is disabled for that run only.
afterEvaluate {
	loom.runs.matching { it.name == "clientGameTest" }.configureEach {
		vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	maxHeapSize = "2G"
	testLogging {
		events "passed", "failed"
		exceptionFormat "full"
		showStandardStreams = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// The license travels with the jar.
jar {
	from('LICENSE') {
		rename { 'LICENSE_chesscraft.txt' }
	}
}
