modLoader = "javafml"
loaderVersion = "[1,)"
license = "CC0-1.0 (Open Sans font: Apache-2.0)"
issueTrackerURL = "https://github.com/shapira0000/chesscraft/issues"

[[mods]]
modId = "chesscraft"
version = "${version}"
displayName = "ChessCraft"
${icon_key} = "assets/chesscraft/icon.png"
authors = "yossi"
